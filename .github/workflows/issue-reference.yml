name: PR Requirements

permissions:
  pull-requests: read
  issues: read

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

jobs:
  pr-requirements:
    name: PR requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request requirements
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            *"[bot]")
              echo "Skipping: PR author $PR_AUTHOR is a bot."
              exit 0
              ;;
          esac

          failures=0

          if printf '%s' "$PR_LABELS" | grep -q '"no-issue"'; then
            echo "Skipping issue reference: the no-issue label is applied."
          else
            PATTERN='(close[sd]?|fix(e[sd])?|resolve[sd]?|ref(erence)?s?)[[:space:]]+(([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+)'
            TARGET='([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+'
            valid=0
            while IFS= read -r ref; do
              target="$(printf '%s' "$ref" | grep -oiE "$TARGET")"
              lower="$(printf '%s' "$target" | tr '[:upper:]' '[:lower:]')"
              case "$lower" in
                https://github.com/*)
                  repo="$(printf '%s' "$lower" | cut -d/ -f4-5)"
                  number="${lower##*/}"
                  ;;
                *)
                  repo="${target%%#*}"
                  number="${target##*#}"
                  repo="${repo:-$DEFAULT_REPO}"
                  ;;
              esac
              kind="$(gh api "repos/$repo/issues/$number" --jq 'if has("pull_request") then "pr" else "issue" end' 2>/dev/null || true)"
              if [ "$kind" = "issue" ]; then
                echo "Verified: '$ref' points to existing issue $repo#$number."
                valid=$((valid + 1))
              elif [ "$kind" = "pr" ]; then
                echo "::warning::'$ref' points to pull request $repo#$number, not an issue."
              else
                echo "::warning::'$ref' does not resolve to an existing issue."
              fi
            done < <(printf '%s' "$PR_BODY" | grep -oiE "$PATTERN" || true)
            if [ "$valid" -eq 0 ]; then
              echo "::error::Every pull request must reference an existing issue. Add 'Closes #<issue>' to the PR body, opening an issue first if none exists. Maintainers can bypass with the no-issue label."
              failures=$((failures + 1))
            fi
          fi

          mapfile -t changed_files < <(gh api --paginate "repos/$DEFAULT_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          product_changed=0
          changelog_changed=0
          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/CHANGELOG.md)
                changelog_changed=1
                ;;
            esac
            case "$file" in
              src/*|plugins/*|.claude-plugin/*|.cursor-plugin/*|assets/*|package.json|package-lock.json|tsconfig.json|tsdown.config.ts)
                product_changed=1
                ;;
            esac
          done

          if [ "$product_changed" -eq 0 ]; then
            echo "Skipping documentation requirement: no product-code paths changed."
          elif [ "$changelog_changed" -eq 1 ]; then
            echo "Verified: docs/CHANGELOG.md changed with product code."
          elif printf '%s' "$PR_LABELS" | grep -q '"no-docs"'; then
            echo "Skipping documentation requirement: the no-docs label is applied."
          else
            echo "::error::Product-code changes must update docs/CHANGELOG.md. Add a user-facing bullet under Unreleased, or ask a maintainer to apply the no-docs label after confirming the documentation is already in sync."
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures pull request requirement(s) failed."
            exit 1
          fi
