name: Issue Reference

permissions:
  pull-requests: read
  issues: read

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

jobs:
  issue-reference:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR body references an existing issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          DEFAULT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            *"[bot]")
              echo "Skipping: PR author $PR_AUTHOR is a bot."
              exit 0
              ;;
          esac
          if printf '%s' "$PR_LABELS" | grep -q '"no-issue"'; then
            echo "Skipping: the no-issue label is applied."
            exit 0
          fi
          PATTERN='(close[sd]?|fix(e[sd])?|resolve[sd]?|ref(erence)?s?)[[:space:]]+(([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+)'
          TARGET='([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+|https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+'
          if ! printf '%s' "$PR_BODY" | grep -qiE "$PATTERN"; then
            echo "::error::Every pull request must reference an existing issue. Add 'Closes #<issue>' to the PR body, opening an issue first if none exists. Maintainers can bypass with the no-issue label."
            exit 1
          fi
          valid=0
          while IFS= read -r ref; do
            target="$(printf '%s' "$ref" | grep -oiE "$TARGET")"
            lower="$(printf '%s' "$target" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              https://github.com/*)
                repo="$(printf '%s' "$lower" | cut -d/ -f4-5)"
                number="${lower##*/}"
                ;;
              *)
                repo="${target%%#*}"
                number="${target##*#}"
                repo="${repo:-$DEFAULT_REPO}"
                ;;
            esac
            kind="$(gh api "repos/$repo/issues/$number" --jq 'if has("pull_request") then "pr" else "issue" end' 2>/dev/null || true)"
            if [ "$kind" = "issue" ]; then
              echo "Verified: '$ref' points to existing issue $repo#$number."
              valid=$((valid + 1))
            elif [ "$kind" = "pr" ]; then
              echo "::warning::'$ref' points to pull request $repo#$number, not an issue."
            else
              echo "::warning::'$ref' does not resolve to an existing issue."
            fi
          done < <(printf '%s' "$PR_BODY" | grep -oiE "$PATTERN")
          if [ "$valid" -eq 0 ]; then
            echo "::error::None of the issue references in the PR body resolve to an existing issue. Link an existing issue, opening one first if needed."
            exit 1
          fi
