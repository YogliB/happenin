name: Issue Reference

permissions:
  pull-requests: read
  issues: read

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

jobs:
  issue-reference:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR body references an existing issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          DEFAULT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            *"[bot]")
              echo "Skipping: PR author $PR_AUTHOR is a bot."
              exit 0
              ;;
          esac
          if printf '%s' "$PR_LABELS" | grep -q '"no-issue"'; then
            echo "Skipping: the no-issue label is applied."
            exit 0
          fi
          PATTERN='(close[sd]?|fix(e[sd])?|resolve[sd]?|ref(erence)?s?)[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'
          if ! printf '%s' "$PR_BODY" | grep -qiE "$PATTERN"; then
            echo "::error::Every pull request must reference an existing issue. Add 'Closes #<issue>' to the PR body, opening an issue first if none exists. Maintainers can bypass with the no-issue label."
            exit 1
          fi
          fail=0
          while IFS= read -r ref; do
            target="$(printf '%s' "$ref" | grep -oE '([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+')"
            repo="${target%%#*}"
            number="${target##*#}"
            repo="${repo:-$DEFAULT_REPO}"
            if gh api "repos/$repo/issues/$number" --jq '.number' >/dev/null 2>&1; then
              echo "Verified: '$ref' points to $repo#$number."
            else
              echo "::error::The referenced issue $repo#$number does not exist. Link an existing issue in the PR body."
              fail=1
            fi
          done < <(printf '%s' "$PR_BODY" | grep -oiE "$PATTERN")
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
