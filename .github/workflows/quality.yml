name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v5

      - name: Pin Node for this matrix leg
        run: echo "${{ matrix.node }}" > .node-version

      - uses: nubjs/setup-nub@v0
        with:
          nub-version: ^0.6.0

      - run: nub --version

      - run: nub ci
      - run: nub run lint:ci
      - run: nub run format:ci
      - run: nub run duplicates:ci
      - run: nub run knip:ci
      - run: nub run typecheck
      - run: nub run test:ci
