name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install happenin from npm
        run: npm install -g happenin

      - name: Sanity check --help
        run: happenin --help

      - name: Sanity check --version
        run: happenin --version

      - name: Sanity check record
        env:
          HAPPENIN_DB: /tmp/happenin-e2e-${{ matrix.os }}.db
        run: |
          mkdir -p /tmp/happenin-e2e
          echo '{"hook_event_name":"sessionStart","sessionId":"e2e-123"}' | happenin record cursor

      - name: Sanity check query
        env:
          HAPPENIN_DB: /tmp/happenin-e2e-${{ matrix.os }}.db
        run: |
          happenin query --format summary
          happenin query --source cursor --event sessionStart --format jsonl

      - name: Sanity check dashboard
        env:
          HAPPENIN_DB: /tmp/happenin-e2e-${{ matrix.os }}.db
        run: |
          happenin dashboard --port 9876 --silent &
          DASHBOARD_PID=$!
          sleep 2
          curl -sf --max-time 5 http://localhost:9876 >/dev/null
          kill $DASHBOARD_PID
